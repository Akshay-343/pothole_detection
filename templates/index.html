<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Road Crack & Pothole Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: antiquewhite;">
<div class="container mt-5" >
    <h1 class="text-center mb-5 fw-bold">Road Crack & Pothole Detection</h1>

    <div class="card p-4 mb-4">
        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="mb-3">
                <input class="form-control" type="file" name="image" accept=".jpg,.png,.jpeg" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Deep Percentile</label>
                    <input type="number" class="form-control" name="deep_percentile" value="{{ deep_percentile }}">
                </div>
                <div class="col">
                    <label class="form-label">Medium Percentile</label>
                    <input type="number" class="form-control" name="medium_percentile" value="{{ medium_percentile }}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Min Area Deep</label>
                    <input type="number" class="form-control" name="min_area_deep" value="{{ min_area_deep }}">
                </div>
                <div class="col">
                    <label class="form-label">Min Area Medium</label>
                    <input type="number" class="form-control" name="min_area_medium" value="{{ min_area_medium }}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Deep Dilation</label>
                    <input type="number" class="form-control" name="deep_dilate" value="{{ deep_dilate }}">
                </div>
                <div class="col">
                    <label class="form-label">Max Boxes</label>
                    <input type="number" class="form-control" name="max_boxes" value="{{ max_boxes }}">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Upload & Process</button>
                <button type="button" class="btn btn-outline-danger" onclick="clearForm()">Clear</button>
            </div>
        </form>
    </div>

    {% if overlay_image %}
    <div class="card p-4">
        <h3 class="text-center mb-3">Processed Image</h3>
        <img src="{{ overlay_image }}" class="img-fluid d-block mx-auto mb-3" style="max-width: 100%; border-radius: 8px;">
        <div class="text-center mb-3">
            <span class="badge bg-danger me-2">Deep (Red): {{ deep_count }}</span>
            <span class="badge bg-warning text-dark">Medium (Orange): {{ medium_count }}</span>
        </div>
        <div class="text-center">
            <a href="{{ overlay_image }}" class="btn btn-success me-2" download>Download Result</a>
            <button type="button" class="btn btn-outline-danger" onclick="clearForm()">Clear</button>
        </div>
    </div>
    {% endif %}
</div>

<script>
function clearForm() {
    window.location.href = "/";
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
